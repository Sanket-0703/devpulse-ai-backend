services:

  # ==========================================
  # Redis
  # ==========================================

  redis:
    image: redis:7.4.10

    # Not published on the host: the backend reaches it on devpulse-network,
    # and host port 6379 is used by compose.dev.yaml's Redis.

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - devpulse-network


  # ==========================================
  # Spring Boot Backend
  # ==========================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:

      # ========================================
      # Spring
      # ========================================

      SPRING_PROFILES_ACTIVE: docker


      # ========================================
      # PostgreSQL
      # ========================================
      # Defaults to the Postgres from compose.dev.yaml on the host.
      # Set DB_HOST / DB_PORT in .env to use AWS RDS instead.

      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5433}

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


      # ========================================
      # Redis
      # ========================================

      REDIS_HOST: redis
      REDIS_PORT: 6379


      # ========================================
      # JWT
      # ========================================

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}


      # ========================================
      # GitHub OAuth
      # ========================================

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      GITHUB_STATE_SECRET: ${GITHUB_STATE_SECRET}


      # ========================================
      # AWS S3 / AI (optional)
      # ========================================

      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-ai}


    # Embedding model download cache (~90 MB), kept across restarts.
    volumes:
      - model_cache:/app/model-cache


    depends_on:
      redis:
        condition: service_healthy


    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start downloads the embedding model.
      start_period: 120s


    restart: unless-stopped

    networks:
      - devpulse-network


# ==========================================
# Internal Network
# ==========================================

networks:

  devpulse-network:
    driver: bridge


volumes:

  model_cache: