services:

  # ==========================================
  # PostgreSQL
  # ==========================================

  postgres:
    image: postgres:17


    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


    restart: unless-stopped
    networks:
      - devpulse-network


  # ==========================================
  # Redis
  # ==========================================

  redis:
    image: redis:7.4.10

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    networks:
      - devpulse-network


  # ==========================================
  # Spring Boot Backend
  # ==========================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile



    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      GITHUB_STATE_SECRET: ${GITHUB_STATE_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    networks:
      - devpulse-network


# ==========================================
# Persistent Volumes
# ==========================================

volumes:

  postgres_data:


# ==========================================
# Internal Network
# ==========================================

networks:

  devpulse-network:
    driver: bridge