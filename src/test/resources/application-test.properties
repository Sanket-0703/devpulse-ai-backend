# Test profile: hermetic values so tests never depend on a developer's .env.
# The datasource and Redis connection come from Testcontainers
# (@ServiceConnection in AbstractIntegrationTest); the values below only
# satisfy placeholders in application.properties.

spring.datasource.username=test
spring.datasource.password=test

# Test-only signing key (>= 256 bits). Not a real secret.
jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d

github.oauth.client-id=test-client-id
github.oauth.client-secret=test-client-secret
github.oauth.redirect-uri=http://localhost/api/github/oauth/callback
github.oauth.state-secret=test-only-state-secret-0123456789

ai.provider=mock
