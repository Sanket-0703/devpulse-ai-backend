# ==========================================
# PostgreSQL - Docker
# ==========================================

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# ==========================================
# Redis - Docker
# ==========================================

spring.data.redis.host=redis
spring.data.redis.port=6379


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==========================================
# GitHub OAuth
# ==========================================

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI}
github.oauth.state-secret=${GITHUB_STATE_SECRET}


# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never