spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/devpulse_ai
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway - Local
# ==========================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=ThisIsMyVerySecretKeyForJwtAuthenticationInDevPulseAI123456
jwt.expiration=86400000

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI}
github.oauth.state-secret=${GITHUB_STATE_SECRET}

spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# AWS S3
# ==========================================

aws.s3.bucket-name=devpulseai-prod-storage-2026-001

# ==========================================
# Spring AI - OpenAI
# ==========================================

spring.ai.openai.api-key=mock-ai

# ==========================================
# AI Configuration
# ==========================================

ai.provider=mock
ai.model=gpt-4o-mini
ai.temperature=0.2

# ==========================================
# Spring AI - PGVector
# ==========================================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# ==========================================
# Spring AI - Local Embeddings
# ==========================================

spring.ai.model.embedding=transformers

# Local Transformers Embedding Model
#spring.ai.embedding.transformer.tokenizer.uri=classpath:/embeddings/tokenizer.json
#spring.ai.embedding.transformer.onnx.model-uri=classpath:/embeddings/model.onnx

spring.ai.embedding.transformer.tokenizer.uri=classpath:/embeddings/tokenizer.json
spring.ai.embedding.transformer.onnx.model-uri=classpath:/embeddings/model.onnx
spring.ai.embedding.transformer.cache.enabled=false
spring.ai.embedding.transformer.onnx.model-output-name=sentence_embedding
