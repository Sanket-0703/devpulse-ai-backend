spring.application.name=backend

# Secrets come from environment variables, or from an untracked .env
# file in the working directory when running locally (see .env.example).
spring.config.import=optional:file:.env[.properties]

# Defaults target the local stack from compose.dev.yaml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:devpulse_ai}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# No database session for the whole web request: services load what they
# need inside their transactions, and no connection is held while a request
# waits on GitHub.
spring.jpa.open-in-view=false

# ==========================================
# Flyway - Local
# ==========================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==========================================
# Web: CORS + API docs
# ==========================================

# Browser origins allowed to call the API (comma-separated).
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.persist-authorization=true

# ==========================================
# Auth tokens
# ==========================================

# Access token (JWT): short-lived, kept in the browser's memory only.
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
# Refresh token: rotated on every use, stored hashed in refresh_tokens.
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}

# The httpOnly cookie that carries the refresh token. secure=false only
# because localhost is plain http; set AUTH_COOKIE_SECURE=true behind HTTPS.
auth.refresh-cookie.name=devpulse_refresh
auth.refresh-cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.refresh-cookie.same-site=Strict
auth.refresh-cookie.path=/api/auth

# ==========================================
# GitHub App (docs/GITHUB_APP_SETUP.md)
# ==========================================

github.app-id=${GITHUB_APP_ID:}
github.app-slug=${GITHUB_APP_SLUG:}
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/oauth/callback}
github.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}
github.web-url=https://github.com
github.api-url=https://api.github.com

# Where the GitHub callback sends the browser afterwards.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# AES-256 key for secrets stored in the database (GitHub tokens).
# Generate with: openssl rand -base64 32
app.security.token-encryption-key=${TOKEN_ENCRYPTION_KEY}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# AWS S3
# ==========================================

aws.s3.bucket-name=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:eu-north-1}

# ==========================================
# Spring AI - OpenAI
# ==========================================

# Placeholder default keeps the OpenAI auto-configuration happy while
# ai.provider=mock; set OPENAI_API_KEY only when using a real provider.
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-ai}

# ==========================================
# AI Configuration
# ==========================================

ai.provider=mock
ai.model=gpt-4o-mini
ai.temperature=0.2

# ==========================================
# Spring AI - PGVector
# ==========================================

# TODO(M6-01): move the vector_store table into a Flyway migration and set
# this to false. Until then Spring AI creates the table at startup; the
# vector extension itself is created by V2__enable_pgvector.sql.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# ==========================================
# Spring AI - Local Embeddings
# ==========================================

spring.ai.model.embedding=transformers

# all-MiniLM-L6-v2 (384 dims, Apache-2.0), pinned to a fixed Hugging Face
# revision so the weights can't change underneath stored vectors.
# Downloaded once on first start, then served from the cache directory.
# For offline use, point the URIs at local copies (file:/path/model.onnx).
spring.ai.embedding.transformer.tokenizer.uri=${EMBEDDING_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json}
spring.ai.embedding.transformer.onnx.model-uri=${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx}
spring.ai.embedding.transformer.onnx.model-output-name=last_hidden_state
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${EMBEDDING_CACHE_DIR:${user.home}/.devpulse/model-cache}
