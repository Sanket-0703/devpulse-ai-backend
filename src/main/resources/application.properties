spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/devpulse_ai
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=ThisIsMyVerySecretKeyForJwtAuthenticationInDevPulseAI123456
jwt.expiration=86400000

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI}
github.oauth.state-secret=${GITHUB_STATE_SECRET}

spring.data.redis.host=localhost
spring.data.redis.port=6379